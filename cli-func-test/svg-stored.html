<section style="max-width:578px;margin:0 auto;font-size:15px;line-height:1.8;">
<section style="padding:20px;background:#f7f5fb;border-radius:12px;">
<p style="margin:0 0 12px;font-weight:bold;">① 静态 SVG（紫色圆角方块）：</p>
<svg width="64" height="64" viewbox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"><rect x="4" y="4" width="56" height="56" rx="12" fill="#7048e8"></rect></svg>
<p style="margin:20px 0 12px;font-weight:bold;">② SMIL 动效 SVG（呼吸圆点）：</p>
<svg width="64" height="64" viewbox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"><circle cx="32" cy="32" r="12" fill="#7048e8"><animate attributename="r" values="12;24;12" dur="1.6s" repeatcount="indefinite"></animate><animate attributename="opacity" values="1;0.2;1" dur="1.6s" repeatcount="indefinite"></animate></circle></svg>
<p style="margin:20px 0 12px;font-weight:bold;">③ 纯文字对照：</p>
<p style="margin:0;color:#444;">如果手机上能看到方块和呼吸圆点，说明极简 SVG 可以通过 API 存稿；如果只剩文字，说明微信清洗所有 SVG。</p>
</section>
